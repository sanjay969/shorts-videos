name: YouTube upload (free, no Zapier)

on:
  schedule:
    # every 15 min, 22:00-03:59 UTC = US Eastern evening (EST 5-11 PM, EDT 6 PM-midnight).
    # The script itself decides by the ET clock: Shorts at 6:00 / 7:30 / 9:00 PM ET, one per slot.
    - cron: '*/15 22,23,0,1,2,3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Upload the next pending video now, ignoring the slot clock'
        type: boolean
        default: false

concurrency:
  group: youtube-upload
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet google-api-python-client google-auth
      - name: Upload next video if its slot has come
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then echo "YT secrets not set yet - skipping"; exit 0; fi
          python scripts/yt_upload.py
      - name: Save upload record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add queue/*/uploaded.json long/uploaded.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to record"; exit 0; fi
          git commit -m "Uploaded via GitHub Actions"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
